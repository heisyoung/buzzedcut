<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzzed Cut — New reel</title><link rel="stylesheet" href="../feedback/flow.css"><link rel="stylesheet" href="performance.css?v=191"><link rel="stylesheet" href="performance-v10.css"><style>#startOverlay{pointer-events:none}#playShow{pointer-events:auto}body>.menu-trigger,body>.menu{z-index:50!important}</style></head><body><button id="pauseShow" class="show-pause" aria-label="Pause show" aria-pressed="false" hidden>Ⅱ</button><div id="pauseShield" hidden aria-hidden="true"></div><section id="screeningStage" style="height:100svh;position:relative;background:#2d1b13"><iframe id="screeningFrame" src="about:blank" title="Studio screening" style="border:0;width:100%;height:100%"></iframe><div id="startOverlay" style="position:absolute;inset:0;display:grid;place-items:center;background:#1a100ba8;z-index:20"><button id="playShow" disabled class="primary" style="font-size:22px;padding:18px 30px">Loading the show…</button></div></section>
<section id="reviewTransition" class="review-transition" aria-label="Show transition" hidden><canvas id="cradle" width="400" height="300" aria-label="Ticking cartoon stopwatch" style="width:min(90vw,360px);height:auto"></canvas></section><main id="feedbackView" hidden><section class="feedback" aria-label="Judges’ feedback"><img class="brand" src="../home-assets/brand-logo-black-larger-cut-v20.png" alt="Buzzed Cut"><button id="sound" class="sound" aria-label="Turn on judge voices">♪<span>Sound off</span></button><section id="frames" class="frames" aria-label="Judge feedback frames"></section><div id="showSubtitle" class="show-subtitle" aria-live="polite"></div><div class="feedback-actions"><button id="ask" class="primary show-ask" hidden><span>ASK!</span><span id="askTimer" class="ask-timer" hidden></span></button><button id="skipQuestions" class="skip-questions" aria-label="Skip questions and reveal scores" title="Skip to scores" hidden>×</button></div><p id="hint" class="hint" aria-live="polite"></p></section>
</main>
<main id="results" hidden aria-label="Final scores"><section class="results"><video id="finalVideo"  playsinline muted loop controls></video><div class="result-shade"></div><h1 class="verdict-title">THE VERDICT</h1><div class="score-heads" id="scoreHeads"></div><div class="average" id="average" hidden><small>The panel’s score</small><strong></strong></div><div class="result-actions"><button id="resultDownload" class="primary" hidden>Download your show ↓</button><a id="newUpload" class="primary upload-next" href="/" hidden>Upload new video ↑</a></div><button id="down" class="down" aria-label="Scroll down"><svg viewBox="0 0 70 63" aria-hidden="true"><path d="M26 4 47 7 43 29 61 29 32 57 8 26 25 28Z" fill="#f3412f" stroke="#461b13" stroke-width="4" stroke-linejoin="round"/><path d="m31 10 8 1-3 24" fill="none" stroke="#ffae6a" stroke-width="4" stroke-linecap="round"/></svg></button></section><section id="saveReview" class="save-review"><div class="save-actions"><button id="downloadVideo" class="primary">Download video ↓</button><a class="secondary" href="/">New upload ↑</a></div><p id="downloadStatus" role="status"></p></section></main>
<button class="menu-trigger" id="menuButton" aria-label="Menu" aria-expanded="false">☰</button><nav class="menu" id="menu" hidden><a href="/">Home</a><a href="/examples.html">Saved shows</a><a href="/privacy.html">Privacy</a><button id="replay">Replay show</button></nav>
<dialog id="composer"><form id="questionForm"><div class="compose-head"><span id="recipient"></span><span id="composeTimer" class="compose-timer"></span><button type="button" id="closeComposer" aria-label="Close question">×</button></div><label class="sr-only" for="question">Your question</label><textarea id="question" placeholder="What would you like to ask?" rows="2" maxlength="600" required></textarea><button class="primary" type="submit">Send ↑</button></form></dialog>
<script src="subtitle-layout.js"></script><script type="module" src="player.js?v=191"></script></body></html>
