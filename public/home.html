 if(!file.type.startsWith('video/')&&!/\.(mp4|mov|webm|m4v|mpeg|mpg)$/i.test(file.name)){showError('Choose a video file, such as MP4 or MOV.');return;}
 $('choose').disabled=true;$('choose').textContent='Checking your video…';
 try{const duration=await readDuration(file);if(id!==selectionId)return;if(duration>MAX_SECONDS+.05)throw new Error('That video is longer than 30 seconds. Trim it and try again.');selected=file;pendingShow='';localStorage.removeItem('buzzed-pending-show');$('retryShow').hidden=true;parent.postMessage({type:'prewarm-show'},location.origin);if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(file);$('preview').src=previewURL;$('file-info').textContent=`${file.name} · ${duration.toFixed(1)} seconds · ${(file.size/1e6).toFixed(1)} MB`;$('review-error').hidden=true;$('review').showModal();}
 catch(e){showError(e.message);}finally{if(id===selectionId){$('choose').disabled=false;$('choose').innerHTML=chooseMarkup;}}
};
function setStatus(title,detail,progress){if(progress!==null){progress=Math.max(lastPercent,progress);lastPercent=progress;}$('status').hidden=false;$('status-title').textContent=title;$('status-detail').textContent=detail;$('upload-percent').hidden=progress===null;$('upload-percent').textContent=progress===null?'':Math.min(100,Math.max(0,Math.round(progress)))+'%';if(progress!==null&&progress<100){const dots=document.createElement('span');dots.className='loading-dots';dots.setAttribute('aria-hidden','true');dots.innerHTML='<i></i><i></i><i></i>';$('upload-percent').append(dots);}}
function upload(file,name,caption,age,guardian){return new Promise((resolve,reject)=>{const req=new XMLHttpRequest();req.open('POST','/api/shows');req.setRequestHeader('Content-Type',file.type||'application/octet-stream');req.setRequestHeader('X-Creator-Name',encodeURIComponent(name));req.setRequestHeader('X-Reel-Title',encodeURIComponent(caption));req.setRequestHeader('X-Creator-Age',String(age));req.setRequestHeader('X-Guardian-Confirmed',guardian?'yes':'no');req.upload.onprogress=e=>{if(e.lengthComputable)setStatus('Uploading your video…','Getting it over to the studio.',Math.round(e.loaded/e.total*20));};req.onload=()=>{if(req.status>=200&&req.status<300)setStatus('Your video is in.','Getting the studio ready.',20);let d;try{d=JSON.parse(req.responseText);}catch{reject(new Error('The studio couldn’t accept the upload. Please try again.'));return;}req.status>=200&&req.status<300?resolve(d):reject(new Error(d.error||'Upload failed. Please try again.'));};req.onerror=()=>reject(new Error('The connection dropped. Please try again.'));req.send(file);});}
const steps={queued:['Your video is in.','Getting the studio ready.'],watching:['The show is about to start!','Getting the studio ready for your moment.'],writing:['Setting the stage.','A little showbiz magic.'],voicing:['Warming up their voices.','Your show is nearly ready.']};
async function poll(id){let failures=0;for(;;){await new Promise(r=>setTimeout(r,1800));let d;try{const r=await fetch('/api/shows/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error();d=await r.json();failures=0;}catch{if(++failures<8)continue;throw new Error('We lost contact with the studio. Please try again.');}if(d.step==='ready'){localStorage.removeItem('buzzed-pending-show');$('retryShow').hidden=true;setStatus('Showtime.','Your judges are ready.',100);if(parent!==window)parent.postMessage({type:'app-navigate',path:'/s/'+encodeURIComponent(id)},location.origin);else location.assign('/s/'+encodeURIComponent(id));return;}if(d.step==='failed')throw new Error('The studio couldn’t finish this video. Please try again.');const [title,detail]=steps[d.step]||steps.queued;setStatus(title,detail,20+Math.round((d.progress||0)*.8));}}
$('send-form').onsubmit=async e=>{e.preventDefault();if(!selected||busy)return;const name=$('name').value.trim();if(!name){$('name').focus();return;}const age=Number($('age').value);if(!Number.isInteger(age)||age<1||age>120){$('age').focus();return;}if(age<16&&!$('guardian').checked){$('guardianRow').hidden=false;$('guardian').focus();return;}attemptStarted=Date.now();$('retryShow').hidden=true;lastPercent=0;busy=true;document.querySelector('.invitation').classList.add('processing');$('send').disabled=true;$('choose').disabled=true;$('review').close();showError('');setStatus('Uploading your video…','Getting it over to the studio.',0);try{const d=await upload(selected,name,$('caption').value.trim(),age,$('guardian').checked);if(!d.id)throw new Error('The studio couldn’t start your show. Please try again.');rememberPending(d.id);sessionStorage.setItem('buzzed-build-start:'+d.id,String(attemptStarted));sessionStorage.setItem('buzzed-upload-ms:'+d.id,String(Date.now()-attemptStarted));await poll(d.id);}catch(error){showError(pendingShow?'Your video is saved. '+error.message:error.message);$('retryShow').hidden=!pendingShow;$('status').hidden=true;busy=false;document.querySelector('.invitation').classList.remove('processing');$('send').disabled=false;$('choose').disabled=false;}};
$('retryShow').onclick=async()=>{if(busy||!pendingShow)return;processing(true);$('retryShow').hidden=true;showError('');setStatus('Getting your show ready…','Your video is already saved.',null);try{const r=await fetch('/api/shows/'+pendingShow+'/retry',{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');await poll(pendingShow);}catch(e){processing(false);showError(e.message);$('retryShow').hidden=false;}};
if(pendingShow&&/^[a-zA-Z0-9_-]{8,70}$/.test(pendingShow)){$('retryShow').hidden=false;showError('Your previous video is saved. Resume it without uploading again.');}
window.addEventListener('pagehide',()=>{if(previewURL)URL.revokeObjectURL(previewURL);});
</script>
<script>document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&a.getAttribute('href').startsWith('/')&&parent!==window){e.preventDefault();parent.postMessage({type:'app-navigate',path:a.getAttribute('href')},location.origin);}});</script><script>addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='keyboard-inset')document.documentElement.style.setProperty('--keyboard-offset',e.data.pixels+'px')});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))parent.postMessage({type:'compose-state',open:true},location.origin)});document.addEventListener('focusout',()=>queueMicrotask(()=>{if(!document.activeElement.matches('input,textarea'))parent.postMessage({type:'compose-state',open:false},location.origin)}));</script></body>
