<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzzed Cut — Saved shows</title><style>*{box-sizing:border-box}body{margin:0;background:#362319 url('/viewing/layers/studio-top-clean-old-bottom-v13.png') center/cover fixed;color:#fff0d5;font:16px Arial}main{margin:24px 15px;padding:20px;background:#27170ff2;border:1px solid #c59660;border-radius:18px}h1{font-size:28px;margin:0 0 10px}p{line-height:1.5;color:#e6c9a7}a,button{cursor:pointer}.upload{display:block;padding:14px;background:#ffd337;color:#2d180a;text-decoration:none;font-weight:bold;border-radius:10px;text-align:center}article{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:15px 0;border-top:1px solid #966b45}img{width:56px;height:85px;object-fit:cover;border-radius:7px}h2{font-size:16px;line-height:1.3;margin:0 0 9px}article a,article button{display:inline-block;font:14px Arial;border:0;background:none;color:#ffdb78;text-decoration:none;padding:5px 8px 5px 0}article button.remove{color:#c8a78b;font-size:12px}</style></head><body><main><h1>Saved shows</h1><p id="empty">Your new shows will appear here after you upload.</p><section id="list"></section><a class="upload" href="/">Upload a new video ↑</a><p><a href="/privacy.html">Privacy</a></p></main><script type="module">
const validId=id=>/^[a-zA-Z0-9_-]{8,70}$/.test(id||'');
const personal=()=>{try{return JSON.parse(localStorage.getItem('buzzed-saved-shows')||'[]').filter(x=>validId(x.id)).slice(0,50)}catch{return[]}};
let featured=[];try{const r=await fetch('/featured-shows.json',{cache:'no-store'});if(r.ok)featured=(await r.json()).filter(x=>validId(x.id));}catch{}
const hidden=()=>{try{return JSON.parse(localStorage.getItem('buzzed-hidden-featured')||'[]')}catch{return[]}};
const read=()=>{const local=personal(),ids=new Set(),items=[];for(const item of [...featured.filter(x=>!hidden().includes(x.id)).map(x=>({...x,...local.find(y=>y.id===x.id)})),...local])if(!ids.has(item.id)){ids.add(item.id);items.push(item);}return items.slice(0,50)};
parent.postMessage({type:'prewarm-show'},location.origin);
function draw(){const items=read(),list=document.getElementById('list');list.replaceChildren();document.getElementById('empty').hidden=!!items.length;for(const item of items){const card=document.createElement('article'),im=document.createElement('img');im.src='/media/shows/'+item.id+'/first-frame.jpg';im.alt='Video thumbnail';const detail=document.createElement('div'),title=document.createElement('h2');title.textContent=item.title||'Your show';const open=document.createElement('a');open.href='/s/'+item.id;open.textContent='Watch ▶';const download=document.createElement('button');download.textContent='Download ↓';download.onclick=async()=>{download.disabled=true;try{let session=item.session;if(!session){const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({show:item.id})});const d=await r.json();if(!r.ok)throw Error();session=d.session;item.session=session;const all=personal();const saved=all.find(x=>x.id===item.id);if(saved)Object.assign(saved,{session});localStorage.setItem('buzzed-saved-shows',JSON.stringify(all));}parent.postMessage({type:'app-download',session,show:item.id,sample:false},location.origin);}catch{download.textContent='Please open the show first';}finally{download.disabled=false}};const remove=document.createElement('button');remove.className='remove';remove.textContent='Remove from list';remove.onclick=()=>{localStorage.setItem('buzzed-saved-shows',JSON.stringify(personal().filter(x=>x.id!==item.id)));if(featured.some(x=>x.id===item.id))localStorage.setItem('buzzed-hidden-featured',JSON.stringify([...new Set([...hidden(),item.id])]));draw()};detail.append(title,open,download,remove);card.append(im,detail);list.append(card);}}draw();document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&parent!==window){e.preventDefault();parent.postMessage({type:'app-navigate',path:a.getAttribute('href')},location.origin);}});
</script></body></html>
